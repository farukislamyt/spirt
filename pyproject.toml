[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spirt"
version = "1.0.0"
description = "Social Profile Intelligence Research Toolkit for public-profile OSINT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faruk Islam" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/farukislamyt/spirt"
Repository = "https://github.com/farukislamyt/spirt"
Issues = "https://github.com/farukislamyt/spirt/issues"

[project.scripts]
spirt = "spirt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/spirt"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
